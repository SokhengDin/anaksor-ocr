name: anaksor-web

services:
  web:
    build: .
    image: anaksor-web:${TAG:-local}
    container_name: anaksor-web

    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-8088}:8080"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    pids_limit: 64
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

    restart: always
